<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f7f6; }
        h2 { text-align: center; color: #333; }
        #chat-box { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: scroll; padding: 15px; margin-bottom: 15px; background: #fff; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .message { margin-bottom: 12px; padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; line-height: 1.5; }
        .user { background-color: #d1e7dd; margin-left: auto; text-align: right; border-bottom-right-radius: 0; }
        .ai { background-color: #e2e3e5; margin-right: auto; text-align: left; border-bottom-left-radius: 0; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        input[type="text"]:focus { border-color: #4CAF50; }
        button { padding: 12px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>🤖 我的 Dify 助手</h2>
    
        <!-- 👇 新增：YOLO 图片识别区域 -->
    <div style="margin-bottom: 20px; padding: 15px; border: 1px dashed #4CAF50; border-radius: 8px; text-align: center;">
        <h3>🖼️ YOLO 图片识别</h3>
        <input type="file" id="image-input" accept="image/*" style="margin-bottom: 10px;">
        <button onclick="uploadImage()" style="background-color: #2196F3;">上传并识别</button>
        <div id="yolo-result" style="margin-top: 15px; font-weight: bold; color: #333;"></div>
    </div>

    <div id="chat-box">
        <!-- 聊天记录会动态显示在这里 -->
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // 1. 显示用户的消息
            chatBox.innerHTML += `<div class="message user">你: ${message}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. 禁用按钮，防止重复点击
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中...';

            // 3. 发送请求给 FastAPI 后端
            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });
                
                const data = await response.json();
                
                // 4. 显示 AI 的回复
                chatBox.innerHTML += `<div class="message ai">AI: ${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                chatBox.innerHTML += `<div class="message ai" style="color: red;">网络错误，请检查后端是否开启。</div>`;
            } finally {
                // 5. 恢复按钮
                sendBtn.disabled = false;
                sendBtn.innerText = '发送';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
                // 👇 新增：处理图片上传和识别
        async function uploadImage() {
            const fileInput = document.getElementById('image-input');
            const resultDiv = document.getElementById('yolo-result');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.innerText = "⚠️ 请先选择一张图片！";
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file); // 对应后端接口参数名 file

            resultDiv.innerText = "⏳ 正在识别中，请稍候...";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/detect', {
                    method: 'POST',
                    body: formData // 注意：这里不用设置 Content-Type，浏览器会自动处理
                });

                const data = await response.json();
                
                if (data.detections && data.detections.length > 0) {
                    let text = "🎯 识别结果：\n";
                    data.detections.forEach(item => {
                        text += `- ${item.class} (置信度: ${item.confidence})\n`;
                    });
                    resultDiv.innerText = text;
                    resultDiv.style.color = "#4CAF50";
                } else {
                    resultDiv.innerText = "🙁 未识别到任何目标物体。";
                    resultDiv.style.color = "#ff9800";
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerText = "❌ 识别失败，请检查后端服务是否开启。";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
